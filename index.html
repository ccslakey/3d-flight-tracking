<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flight Replay</title>
    <style>
      html, body, #cesiumContainer { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
      .side-panel {
        position: absolute; top: 12px; left: 12px; z-index: 10; width: 280px; max-width: calc(100% - 24px);
        display: flex; flex-direction: column; gap: 8px; max-height: calc(100% - 140px);
      }
      .flight-list, .trail-legend, .error-banner {
        padding: 8px 10px; border-radius: 4px;
        font: 13px/1.6 system-ui, sans-serif; color: #eee; background: rgba(30, 30, 30, 0.85);
      }
      .error-banner { position: absolute; top: 12px; left: 12px; z-index: 11; }
      .flight-list { display: flex; flex-direction: column; min-height: 0; }
      .flight-list-title { font-weight: 600; }
      .flight-list-search {
        margin: 4px 0; padding: 3px 6px; font: inherit; color: inherit;
        background: rgba(255, 255, 255, 0.08); border: 1px solid #555; border-radius: 3px;
      }
      .flight-list ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; min-height: 0; }
      .flight-list li {
        display: grid; grid-template-columns: 1fr auto auto; gap: 8px;
        padding: 1px 4px; border-radius: 3px; cursor: pointer;
      }
      .flight-list li:hover { background: rgba(255, 255, 255, 0.1); }
      .flight-list li.is-selected { background: rgba(77, 210, 255, 0.3); }
      .flight-list li.is-landing .fl-callsign { color: #7cf29a; }
      .fl-type, .fl-time { color: #aaa; font-variant-numeric: tabular-nums; }
      .trail-legend label { display: block; cursor: pointer; }
      .trail-legend-title { font-weight: 600; margin-bottom: 2px; }
      .trail-swatch { display: inline-block; width: 14px; height: 3px; margin: 0 4px; vertical-align: middle; }
      .error-banner { background: rgba(140, 20, 20, 0.9); max-width: 60ch; }
      .validation-panel {
        position: absolute; top: 50px; right: 12px; z-index: 10; max-width: calc(100% - 24px);
        padding: 8px 10px; border-radius: 4px;
        font: 12px/1.5 system-ui, sans-serif; color: #eee; background: rgba(30, 30, 30, 0.85);
      }
      .validation-panel table { border-collapse: collapse; }
      .validation-panel th, .validation-panel td { padding: 1px 8px 1px 0; text-align: right; }
      .validation-panel th:first-child, .validation-panel td:first-child { text-align: left; }
      .validation-title { font-weight: 600; margin-bottom: 4px; }
      .validation-note { margin-top: 4px; color: #aaa; max-width: 36ch; }
      /* Just right of the animation widget, above the credits line. */
      .live-button {
        position: absolute; left: 180px; bottom: 62px; z-index: 10;
        padding: 3px 10px; border: 1px solid #666; border-radius: 3px; cursor: pointer;
        font: 600 12px/1.4 system-ui, sans-serif; letter-spacing: 0.05em;
        color: #bbb; background: rgba(30, 30, 30, 0.85);
      }
      .live-button::before { content: "● "; color: #777; }
      .live-button.is-live { color: #fff; border-color: #d33; cursor: default; }
      .live-button.is-live::before { color: #f44; }
      .connection-panel {
        position: absolute; top: 50px; right: 12px; z-index: 10; max-width: calc(100% - 24px);
        padding: 8px 10px; border-radius: 4px; border-left: 3px solid #7cf29a;
        font: 12px/1.5 system-ui, sans-serif; color: #eee; background: rgba(30, 30, 30, 0.85);
      }
      .connection-panel.is-warn { border-left-color: #ffc94d; }
      .connection-panel.is-bad { border-left-color: #ff5c5c; }
      .connection-title { font-weight: 600; margin-bottom: 2px; }
      .connection-row { display: grid; grid-template-columns: 6.5em auto; gap: 8px; }
      .connection-row span:first-child { color: #aaa; }
      .connection-row.is-warn span:last-child { color: #ffc94d; }
      .connection-row.is-bad span:last-child { color: #ff5c5c; }
      .help-button svg { display: block; }
      .help-overlay {
        position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
        padding: 16px; background: rgba(0, 0, 0, 0.45);
      }
      .help-overlay[hidden] { display: none; }
      .help-panel {
        max-width: min(420px, 100%); max-height: 100%; overflow-y: auto; padding: 14px 18px; border-radius: 6px;
        font: 13px/1.6 system-ui, sans-serif; color: #eee; background: rgba(30, 30, 30, 0.95);
      }
      .help-title { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
      .help-section { margin-top: 10px; color: #aaa; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
      .help-rows { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; align-items: center; }
      .help-rows kbd {
        display: inline-block; min-width: 1.6em; margin-right: 3px; padding: 0 5px; text-align: center;
        font: 600 12px/1.6 ui-monospace, monospace; border: 1px solid #666; border-bottom-width: 2px; border-radius: 3px;
        background: rgba(255, 255, 255, 0.08);
      }
      .help-note { margin-top: 12px; color: #aaa; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
